<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тест: Наследственное право</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --error: #ef4444;
    --warning: #eab308;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 10px 12px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #start-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex: 1;
    text-align: center;
    gap: 24px;
  }
  #start-screen h1 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #start-screen p { color: var(--text-muted); max-width: 400px; }
  .start-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
  }
  .start-options label {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .start-options label:hover, .start-options label.active { border-color: var(--accent); }
  .start-options input[type="radio"] { accent-color: var(--accent); width: 18px; height: 18px; }
  .custom-input {
    display: none;
    margin-top: 8px;
    width: 100%;
  }
  .custom-input input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
  }
  .btn {
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }
  #quiz-screen, #results-screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #quiz-screen {
    height: calc(100dvh - 20px);
    max-height: calc(100dvh - 20px);
    overflow: hidden;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .question-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.35;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--bg);
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .option:hover:not(.disabled) { border-color: var(--accent); }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.15); }
  .option.correct { border-color: var(--success); background: rgba(34,197,94,0.15); }
  .option.wrong { border-color: var(--error); background: rgba(239,68,68,0.15); }
  .option.disabled { cursor: default; pointer-events: none; }
  .option input {
    margin-top: 3px;
    accent-color: var(--accent);
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    pointer-events: none; /* click goes to the row */
  }
  .option label {
    cursor: pointer;
    flex: 1;
    pointer-events: none; /* click goes to the row */
    -webkit-user-select: none;
    user-select: none;
  }
  .option {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .nav-buttons {
    display: flex;
    gap: 8px;
    margin-top: 0;
    padding-top: 8px;
    flex-shrink: 0;
  }
  .nav-buttons .btn { flex: 1; }
  #check-btn { display: block; }
  #next-btn { display: none; }
  #results-screen h2 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 8px;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--success) calc(var(--pct) * 1%), var(--border) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--card);
  }
  .score-value {
    position: relative;
    font-size: 2rem;
    font-weight: 700;
  }
  .errors-list {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .error-item {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    border-left: 4px solid var(--error);
  }
  .error-item .q { font-weight: 600; margin-bottom: 8px; }
  .error-item .user-ans { color: var(--error); }
  .error-item .correct-ans { color: var(--warning); }
  .feedback {
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 500;
    display: none;
    font-size: 0.9rem;
  }
  .feedback.ok { display: block; background: rgba(34,197,94,0.2); color: var(--success); }
  .feedback.bad { display: block; background: rgba(239,68,68,0.2); color: var(--error); }
  @media (max-width: 480px) {
    .container { padding: 8px 10px; }
    .question-text { font-size: 0.98rem; }
    .option { padding: 9px 10px; gap: 8px; }
    .option input { width: 18px; height: 18px; }
    .btn { padding: 10px 12px; font-size: 0.9rem; }
    .question-card { padding: 10px 12px; }
    #quiz-screen { height: calc(100dvh - 16px); max-height: calc(100dvh - 16px); }
  }
</style>
</head>
<body>
<div class="container">
  <!-- START -->
  <div id="start-screen">
    <h1>Наследственное право</h1>
    <p>Тест по файлам. Всего вопросов в базе: <span id="total-count">…</span>.</p>
    <div class="start-options">
      <label class="active" onclick="selectMode(this, 'all')">
        <input type="radio" name="mode" value="all" checked> Все вопросы
      </label>
      <label onclick="selectMode(this, '20')">
        <input type="radio" name="mode" value="20"> 20 вопросов
      </label>
      <label onclick="selectMode(this, '50')">
        <input type="radio" name="mode" value="50"> 50 вопросов
      </label>
      <label onclick="selectMode(this, 'custom')">
        <input type="radio" name="mode" value="custom"> Своё количество
      </label>
      <div class="custom-input" id="custom-wrap">
        <input type="number" id="custom-num" min="1" max="999" placeholder="Введите число" value="30">
      </div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">Начать тест</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="q-meta">
      <span id="q-counter">Вопрос 1 / 10</span>
      <span id="q-type"></span>
    </div>
    <div class="question-card">
      <div class="question-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="back-btn" onclick="prevQuestion()">← Назад</button>
      <button class="btn btn-primary" id="check-btn" onclick="checkAnswer()">Проверить</button>
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()">Далее →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen">
    <h2>Результаты</h2>
    <div class="score-circle" id="score-circle">
      <div class="score-value" id="score-value">0%</div>
    </div>
    <p style="text-align:center;color:var(--text-muted)" id="score-text"></p>
    <div class="errors-list" id="errors-list"></div>
    <button class="btn btn-primary" style="margin-top:24px;width:100%" onclick="location.reload()">Пройти ещё раз</button>
  </div>
</div>

let questions = [];
let current = 0;
let userAnswers = []; // array of arrays of selected option indices
let answered = [];    // boolean

(function initCounts() {
  const total = quizQuestions.length;
  const totalEl = document.getElementById('total-count');
  const allEl = document.getElementById('all-count');
  const customInput = document.getElementById('custom-num');
  if (totalEl) totalEl.textContent = total;
  if (allEl) allEl.textContent = total;
  if (customInput) {
    customInput.max = total;
    if (parseInt(customInput.value) > total) customInput.value = total;
  }
})();
  
function selectMode(label, mode) {
  document.querySelectorAll('.start-options label').forEach(l => l.classList.remove('active'));
  label.classList.add('active');
  document.getElementById('custom-wrap').style.display = mode === 'custom' ? 'block' : 'none';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  let count = quizQuestions.length;
  if (mode === '20') count = 20;
  else if (mode === '50') count = 50;
  else if (mode === 'custom') {
    count = parseInt(document.getElementById('custom-num').value) || 30;
    count = Math.min(Math.max(1, count), quizQuestions.length);
  }
  // shuffle and take
  questions = shuffle([...quizQuestions]).slice(0, count);
  // shuffle options for each
  questions = questions.map(q => {
    const idxs = q.options.map((_, i) => i);
    shuffle(idxs);
    const newOpts = idxs.map(i => q.options[i]);
    const newCorrect = q.correct.map(c => {
      const oldIdx = q.options.indexOf(c);
      return newOpts[idxs.indexOf(oldIdx)] !== undefined ? newOpts[idxs.indexOf(oldIdx)] : c;
    }).filter(Boolean);
    // remap correctly
    const correctSet = new Set(q.correct.map(c => c.toLowerCase()));
    const mappedCorrect = newOpts.filter(o => correctSet.has(o.toLowerCase()) || [...correctSet].some(c => o.toLowerCase().includes(c) || c.includes(o.toLowerCase())));
    return { ...q, options: newOpts, correct: mappedCorrect.length ? mappedCorrect : q.correct };
  });
  userAnswers = questions.map(() => []);
  answered = questions.map(() => false);
  current = 0;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'flex';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('q-counter').textContent = `Вопрос ${current + 1} / ${questions.length}`;
  document.getElementById('q-type').textContent = q.multi ? 'Несколько ответов' : 'Один ответ';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = ((current) / questions.length * 100) + '%';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  const isAnswered = answered[current];
  const selected = userAnswers[current] || [];

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    if (isAnswered) div.classList.add('disabled');
    const inputType = q.multi ? 'checkbox' : 'radio';
    const checked = selected.includes(i) ? 'checked' : '';
    const id = `opt-${current}-${i}`;
    div.innerHTML = `<input type="${inputType}" name="opt" id="${id}" value="${i}" ${checked} ${isAnswered ? 'disabled' : ''}>
                     <label for="${id}">${opt}</label>`;
    if (!isAnswered) {
      div.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        selectOption(i);
      });
    }
    if (isAnswered) {
      const isCorrect = q.correct.some(c => c.toLowerCase() === opt.toLowerCase() || opt.toLowerCase().includes(c.toLowerCase()) || c.toLowerCase().includes(opt.toLowerCase()));
      if (selected.includes(i) && !isCorrect) div.classList.add('wrong');
      if (isCorrect) div.classList.add('correct');
      if (selected.includes(i)) div.classList.add('selected');
    } else if (selected.includes(i)) {
      div.classList.add('selected');
    }
    optsDiv.appendChild(div);
  });

  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback';
  feedback.style.display = 'none';

  const checkBtn = document.getElementById('check-btn');
  const nextBtn = document.getElementById('next-btn');
  const backBtn = document.getElementById('back-btn');

  backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';

  if (isAnswered) {
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'block';
    const wasCorrect = isAnswerCorrect(current);
    if (wasCorrect) {
      feedback.textContent = 'Верно!';
      feedback.className = 'feedback ok';
    } else {
      feedback.textContent = 'Неверно';
      feedback.className = 'feedback bad';
    }
  } else {
    checkBtn.style.display = 'block';
    nextBtn.style.display = 'none';
  }
}

function selectOption(i) {
  const q = questions[current];
  if (answered[current]) return;
  if (q.multi) {
    const idx = userAnswers[current].indexOf(i);
    if (idx >= 0) userAnswers[current].splice(idx, 1);
    else userAnswers[current].push(i);
  } else {
    userAnswers[current] = [i];
  }
  // sync DOM: checked + selected class
  document.querySelectorAll('.option').forEach((el, j) => {
    const inp = el.querySelector('input');
    const isSel = userAnswers[current].includes(j);
    el.classList.toggle('selected', isSel);
    if (inp) inp.checked = isSel;
  });
}

function isAnswerCorrect(idx) {
  const q = questions[idx];
  const selected = userAnswers[idx] || [];
  const selectedTexts = selected.map(i => q.options[i].toLowerCase());
  const correctTexts = q.correct.map(c => c.toLowerCase());
  if (selectedTexts.length !== correctTexts.length) return false;
  return correctTexts.every(c => selectedTexts.some(s => s === c || s.includes(c) || c.includes(s)));
}

function checkAnswer() {
  if (userAnswers[current].length === 0) {
    alert('Выберите хотя бы один вариант');
    return;
  }
  answered[current] = true;
  const correct = isAnswerCorrect(current);
  renderQuestion();

  if (correct) {
    // Auto-advance after short delay
    if (current < questions.length - 1) {
      setTimeout(() => {
        current++;
        renderQuestion();
      }, 1);
    } else {
      setTimeout(showResults, 1);
    }
  }
  // if wrong — user must press Далее
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'flex';

  let correctCount = 0;
  const errors = [];
  for (let i = 0; i < questions.length; i++) {
    if (isAnswerCorrect(i)) correctCount++;
    else {
      const q = questions[i];
      const userSel = (userAnswers[i] || []).map(j => q.options[j]);
      errors.push({ q: q.q, user: userSel, correct: q.correct });
    }
  }
  const pct = Math.round(correctCount / questions.length * 100);
  document.getElementById('score-circle').style.setProperty('--pct', pct);
  document.getElementById('score-value').textContent = pct + '%';
  document.getElementById('score-text').textContent = `Правильно: ${correctCount} из ${questions.length}`;

  const list = document.getElementById('errors-list');
  list.innerHTML = '';
  if (errors.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--success)">Отлично! Ошибок нет.</p>';
  } else {
    const h = document.createElement('h3');
    h.textContent = 'Ошибки:';
    h.style.marginBottom = '12px';
    list.appendChild(h);
    errors.forEach((e, i) => {
      const div = document.createElement('div');
      div.className = 'error-item';
      div.innerHTML = `<div class="q">${i+1}. ${e.q}</div>
        <div class="user-ans">Ваш ответ: ${e.user.join('; ') || '—'}</div>
        <div class="correct-ans">Правильно: ${e.correct.join('; ')}</div>`;
      list.appendChild(div);
    });
  }
}
